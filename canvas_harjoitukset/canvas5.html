<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas5</title>
</head>
<body>
    <canvas id="koordinaatistoCanvas" width="400" height="300"></canvas>  
  
<script>  
  const canvas = document.getElementById("koordinaatistoCanvas");  
  const ctx = canvas.getContext("2d");  
    
  ctx.fillStyle = "red";  
  ctx.fillRect(0, 0, 100, 80);      // vasen yläkulma  
    
  ctx.fillStyle = "blue";  
  ctx.fillRect(300, 220, 100, 80);  // oikea alakulma  
</script>  

</body>
</html>
