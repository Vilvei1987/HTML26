<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas14</title>
</head>
<body>

<canvas id="animaatioCanvas" width="400" height="300"></canvas>

<script>
    const canvas = document.getElementById("animaatioCanvas");
    const ctx = canvas.getContext("2d");

    let x = 50;
    let y = 150;

    function animoi() {

        // 1. Tyhjennä Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 2. Päivitä sijainti
        x = x + 2;
        y = y + 1;

        // Aloita alusta, kun pallo menee oikeasta reunasta
        if (x > canvas.width) {
            x = 0;
        }

        // Aloita alusta, kun pallo menee alareunasta
        if (y > canvas.height) {
            y = 0;
        }

        // 3. Piirrä pallo
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fillStyle = "blue";
        ctx.fill();

        // 4. Jatka animaatiota
        requestAnimationFrame(animoi);
    }

    // Käynnistä animaatio
    animoi();
</script>

</body>
</html>
