<!DOCTYPE html>  
<html lang="fi">  
<head>  
  <meta charset="UTF-8">  
  <title>Ensimmäinen SVG</title> 
</head>  
<body>  
  <h1>Testaillaan SVG juttuja</h1>  
    
  <!-- Sisäinen SVG -->  
  <svg width="400" height="600" viewBox="0 0 600 800">  
    <circle cx="100" cy="100" r="40" fill="#9b59b6" />    
    <ellipse cx="400" cy="100" rx="80" ry="40" fill="#f39c12" />  
    <line x1="100" y1="200" x2="100" y2="350" stroke="#2ecc71" stroke-width="4" />  
    <polyline points="250,200 320,260 400,220 500,350" fill="none" stroke="#e67e22" stroke-width="3" />  
    <polygon points="100,500 40,650 160,650" fill="#2ecc71"/>  
    <rect x="350" y="500" width="60" height="60" fill="#3498db" />

  </svg> 
  
</body>  
</html>
