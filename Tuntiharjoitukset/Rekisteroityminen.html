<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekisteröityminen</title>
</head>
<body>
    <h1>Rekisteröidy</h><br><br>
        <form>
    <label for="kayttajanimi">Käyttäjänimi</label><br>
    <input type="text" id="kayttajanimi" name="Käyttäjänimi" required><br>
    <label for="sahkoposti">Sähköposti</label><br>
    <input type="email" id="sahkoposti" name="Sähköposti" required ><br>

    <label for="salasana">Salasana</label><br>
    <input type="password" id="salasana" name="salasana" required><br>

    <label for="vahvistus">Vahvista salasana</label><br>
    <input type="password" id="vahvistus" name="vahvistus" required><br>

    <label for="syntymapaiva">Syntymäpäivä</label><br>
    <input type="date" id="syntymapaiva" name="Syntymäpäivä" required><br>

    <input type="checkbox" id="kayttoehdot" name="Kayttoehdot" required>
    <label for="kayttoehdot">Hyväksyn käyttöehdot</label><br>

    <button type="submit">Lähetä</button>
</form>
</html>
