<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lomake</title>
    <link rel="stylesheet" href="css/lomake.css">
</head>
<body>
    <header>
        <h1>Rekisteröidy</h1>
    </header>
    <main>
    <form>
    <label for="nimi">Nimi:</label>
    <input type="text" id="nimi" required>

    <label for="email">Sähköposti:</label>
    <input type="email" id="email" required>

    <label for="salasana">Salasana:</label>
    <input type="password" id="salasana" required minlength="8">

    <label for="confirm">Salasana uudelleen:</label>
    <input type="password" id="confirm" required minlength="8">

    <label class="checkbox">
    Hyväksyn ehdot:
    <input type="checkbox">
    </label>
    
    <button>Lähetä</button>
    <button disabled>Ei käytössä</button>
</form>
    </main>
    <footer>
        <p>&copy; Ville Veijonen</p>
    </footer>
</body>
</html>
