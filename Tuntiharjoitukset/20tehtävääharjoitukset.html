<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 HTML tehtävää</title>
</head>
<h1>Osa 7:n harjoitukset</h1>
<body>
    <form>
    <label for="nimi">Nimi:</label>
    <input 
        id="nimi" 
        name="nimi"    
        type="text">
        <br>

    <label for="sähköposti">Sähköposti:</label>
    <input 
        id="sähköposti" 
        name="sähköposti" 
        type="email">
        <br>

    <label for="salasana">Salasana:</label>
    <input id="salasana" 
        name="salasana" 
        type="password" required>
        <br>

   <label for="ika">Ikä:</label>
    <input 
        id="ika" 
        name="ika" 
        type="number"> 
        <br>

        
</form>
</body>
</html>
