<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yhteydenotto</title>
</head>
<body>
    <h1>Ota yhteyttä</h1>
<form

    <label for="Sahkoposti">Sähköposti:</label><br>
    <input type="Sahkoposti" id="Sahkoposti" name="Sahkoposti" required><br><br>

    <label for="Aihe">Aihe:</label><br>
    <input type="text" id="Aihe" name="Aihe" required><br><br>

    <label for="Viesti">Viesti:</label><br>
    <textarea id="Viesti" name="Viesti" rows="8" required></textarea><br><br>

    <button type="Lähetä">Lähetä</button>

</form>
</body>
</html>
